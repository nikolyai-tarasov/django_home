{% extends 'base.html' %}

{% block title %} Редактирование карты продукта {% endblock %}
{% load my_tags %}
{% block content %}
<h2>Редактирование карты товара </h2>
<div class="col-6 col-md">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:product_detail' product.id %}">Отмена</a>

    </form>
</div>


{% include 'header.html' %}
{% endblock %}
