{% extends 'base.html' %}

{% block title %} Удаление карты продукта {% endblock %}
{% load my_tags %}
{% block content %}
<h2>Удаление карты продукта </h2>
<div class="col-6 col-md">

        {% csrf_token %}

        <button type="submit" class="btn btn-danger">Удалить</button>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:product_detail' product.id %}">Отмена</a>

    </form>
</div>

{% endblock %}
